name: Zola Build

on:
  pull_request:
  push:
    branches:
      - publish
      - draft

env:
  GIT_PAGES_CLI_VERSION: v1.8.0
  BLOG_URL: https://blog.janmasrovira.org/
  DRAFT_BLOG_URL: https://draft.blog.janmasrovira.org/

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/workflows/get-zola

      - name: Run zola build
        id: build
        run: zola build ${{ github.ref == 'refs/heads/draft' && format('--base-url {0}', env.DRAFT_BLOG_URL) || '' }}

      - name: Upload static files as artifact
        id: upload-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-github:
    needs: build
    if: github.ref == 'refs/heads/publish'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Deploys the same artifact to the self-hosted git-pages instance:
  # publish branch -> blog.janmasrovira.org, draft branch -> draft.blog.janmasrovira.org.
  deploy-blog:
    needs: build
    if: github.ref == 'refs/heads/publish' || github.ref == 'refs/heads/draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact/
      - run: tar -xf artifact/artifact.tar -C artifact/ && rm artifact/artifact.tar
      - name: Install git-pages-cli
        run: go install codeberg.org/git-pages/git-pages-cli@${{ env.GIT_PAGES_CLI_VERSION }}
      - name: Deploy to git-pages
        # publish branch -> BLOG_URL; draft branch -> DRAFT_BLOG_URL
        run: $(go env GOPATH)/bin/git-pages-cli ${{ github.ref == 'refs/heads/publish' && env.BLOG_URL || env.DRAFT_BLOG_URL }} --upload-dir artifact
        env:
          GIT_PAGES_PASSWORD: ${{ github.ref == 'refs/heads/publish' && secrets.GIT_PAGES_PASSWORD || secrets.DRAFT_GIT_PAGES_PASSWORD }}
